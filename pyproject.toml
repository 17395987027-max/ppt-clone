[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-clone"
version = "0.1.0"
description = "Replicate a reference PPTX design: extract its spec, generate slides, export native DrawingML shapes"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.21",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "lxml>=4.9.0",
    "pdf2image>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["ppt_clone*"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "scripts/ppt_cli.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
